<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#111111" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>店舗仕入れカメラ</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./styles.css?v=20260909j" />
</head>
<body>
  <main class="app-shell">
    <section class="camera-stage" aria-label="カメラ">
      <video id="preview" autoplay playsinline muted></video>
      <canvas id="captureCanvas" hidden></canvas>
      <div id="focusRing" class="focus-ring" hidden></div>
      <div class="topbar">
        <button id="flashBtn" class="chip" type="button" disabled>LIGHT —</button>
        <span id="statusChip" class="chip">起動中</span>
        <span id="localChip" class="chip">端末 0</span>
        <span id="driveChip" class="chip">Drive 0</span>
        <span id="queueChip" class="chip">未送信 0</span>
      </div>
      <div id="warning" class="warning" hidden></div>
    </section>
    <section class="controls">
      <div class="zoom-row">
        <button class="zoom-btn" data-zoom="1" type="button">1×</button>
        <button class="zoom-btn" data-zoom="2" type="button">2×</button>
        <input id="zoomSlider" type="range" min="1" max="4" value="1" step="0.1" aria-label="ズーム" />
      </div>
      <button id="shutter" class="shutter" type="button" aria-label="撮影" disabled><span></span></button>
      <div class="meta-row">
        <span id="shotCount">撮影 0</span>
        <div class="meta-actions"><button id="galleryBtn" class="text-btn" type="button">端末写真</button><button id="syncBtn" class="text-btn" type="button">再送</button></div>
      </div>
    </section>
  </main>
  <section id="localGallery" class="gallery" hidden aria-hidden="true" aria-label="端末内写真">
    <div class="gallery-panel">
      <header class="gallery-header"><div><strong>端末内写真</strong><div id="gallerySummary" class="gallery-summary"></div></div><button id="galleryClose" type="button" class="gallery-close">閉じる</button></header>
      <div class="gallery-help">Drive連携が切れていても、ここに表示される写真は端末側に残っています。「共有・保存」から写真アプリやファイルへ手動退避できます。</div>
      <div id="galleryList" class="gallery-list"></div>
      <footer class="gallery-footer"><button id="galleryRetry" class="text-btn" type="button">未送信をすべて再送</button></footer>
    </div>
  </section>
  <script type="module" src="./app.js?v=20260909j"></script>
</body>
</html>
